<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda libra | Reservas</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <nav id="menu">
            <a href="../index.html" class="btn.cta">Inicio</a>
            <a href="./tarifas.html" class="btn.cta">Tarifas</a>
            <a href="./reservas.html" class="btn.cta">Reservas</a>
        </nav>
        <h1>Reserva tu bicicleta</h1>
        <a href="reservas@ruedalibre.example">Correo de reservas</a>
    </header>

    <main>
        <section>
            <header>
                <h1>Formulario de reserva</h1>
            </header>
            <form action="submit" method="post">
                <fieldset>
                    <legend>Tus datos</legend>
                    <div>
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" minlength="3" required>
                    </div>

                    <div>
                        <label for="documento">Numero de documento</label>
                        <input type="tel" id="documento" name="documento" pattern="[0-9]{6,10}" title="Entre 6 y 10 digitos" required>
                    </div>

                    <div>
                        <label for="correo">Correo electronico</label>
                        <input type="email" id="correo" name="correo" required>
                    </div>

                    <div>
                        <label for="numero">Numero de celular</label>
                        <input type="tel" id="numero" name="numero" min="10" max="10" pattern="3[0-9]{9}" title="El numero debe empezar con 3 y tener 10 digitos exactos" required>
                    </div>
                </fieldset>

                <fieldset>
                <legend>Tu alquiler</legend>
                    <div>
                        <label for="fecha">Fecha del alquiler</label>
                        <input type="date" id="fecha" name="fecha" min="2026-11-01" max="2026-12-31" required>
                    </div>

                    <div>
                        <label for="tipo">Tipo de bicicleta</label>
                        <select name="tipo" id="tipo" required>
                            <option value="mt">Bicicleta de montaña</option>
                            <option value="urba">Bicicleta urbana</option>
                            <option value="elec">Bicicleta electrica</option>
                        </select>
                    </div>

                    <div>
                        <label for="plan">Plan</label>
                        <select name="plan" id="plan" required>
                            <option value="1h">1 hora</option>
                            <option value="mediod">Medio dia (4 horas)</option>
                            <option value="1d">Dia completo</option>
                        </select>
                    </div>

                    <div>
                        <label for="cantidadbici">Cantidad de bicicletas</label>
                        <select name="cantidadbici" id="cantidadbici" required>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                        </select>
                    </div>

                    <div>
                        <label for="ruta">Ruta</label>
                        <select name="ruta" id="ruta" required>
                            <option value="ninguna">Ninguna</option>
                            <option value="rio">Rio y Parques</option>
                            <option value="barrio">Sabores de Barrio</option>
                            <option value="palmas">Retro Las Palmas</option>
                        </select>
                    </div>
                </fieldset>
                
                <fieldset>
                    <legend>Confirmacion</legend>
                    <div>
                        <label for="comentarios">Dejanos un comentario, puede ser una duda, sugerencia o cosas a tener en cuenta</label><br>
                        <textarea name="comentarios" id="comentarios" maxlength="300" title="Debe contener menos de 300 caracteres"></textarea>
                    </div>

                    <div>
                        <label for="politicas">Aceptacion de las politicas de alquiler</label>
                        <input type="checkbox" id="politicas" name="politicas" required>
                    </div>

                    <div>
                        <button type="submit">Enviar</button>
                    </div>
                </fieldset>
            </form>
        </section>

        <section>
            <dl>
                <dt>Lunes a viernas</dt>
                <dd>7:00 a. m. a 7:00 p. m</dd>
                <dt>sábados, domingos y festivos</dt>
                <dd>6:00 a. m. a 2:00 p. m.</dd>
            </dl>
        </section>
    </main>

    <footer>
        <p>Rueda-libre | Medellin</p>
        <p>hola@ruedalibre.example</p>
        <p>2026</p>
    </footer>
</body>
</html>
